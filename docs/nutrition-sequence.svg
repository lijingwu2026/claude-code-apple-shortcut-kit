<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 793" width="960" height="793" role="img" aria-label="Nutrition log example, in order: 1 you tap the shortcut; 2 it reads your profile from iCloud Drive; 3 it reads today's intake from Health; 4 it shows your target and what is left and asks for a camera photo, a photo or a screenshot; 5 and 6 it gets the photo; 7 and 8 Apple Intelligence names the food and returns 9 nutrient values; 9 you confirm or correct and say how much you ate; 10 it writes and saves 9 nutrients in Health; 11 Apple Intelligence writes a 1–2 line cheer on your target, eaten and left; 12 you get a record card with today's total">
<style>
:root{--bg:#FFFFFF;--ink:#16150F;--sub:#5A5547;--line:#8A8576;--step:#F7F6F2;--stepline:#D6D3C9;--teal:#0B6E57;--tealbg:#E6F1EC;--amber:#8A5A00;--amberbg:#FBF3E4;}
@media (prefers-color-scheme:dark){:root{--bg:#0D1117;--ink:#EFEDE6;--sub:#C9C4B6;--line:#8C877A;--step:#1D1B15;--stepline:#3B382E;--teal:#3FB592;--tealbg:#13291F;--amber:#E0A93B;--amberbg:#2A2112;}}
svg{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}
.bg{fill:var(--bg)} .life{stroke:var(--stepline);stroke-width:1.5;stroke-dasharray:4 5}
.h{fill:var(--step);stroke:var(--stepline)} .h.you{fill:var(--amberbg);stroke:var(--amber)} .h.sc{fill:var(--tealbg);stroke:var(--teal)}
.ht{fill:var(--ink);font-size:12.5px;font-weight:700;letter-spacing:.06em} .ht.you{fill:var(--amber)} .ht.sc{fill:var(--teal)}
.m{stroke:var(--line);stroke-width:1.6;fill:none} .m.sc{stroke:var(--teal)} .ar{fill:var(--line)} .ar.sc{fill:var(--teal)}
.l{fill:var(--ink);font-size:14.5px} .nc{fill:var(--step);stroke:var(--stepline)} .n{fill:var(--sub);font-size:11px;font-weight:700}
</style>
<rect class="bg" width="960" height="793"/>
<line class="life" x1="110" y1="56" x2="110" y2="783"/>
<line class="life" x1="300" y1="56" x2="300" y2="783"/>
<line class="life" x1="452" y1="56" x2="452" y2="783"/>
<line class="life" x1="612" y1="56" x2="612" y2="783"/>
<line class="life" x1="764" y1="56" x2="764" y2="783"/>
<line class="life" x1="892" y1="56" x2="892" y2="783"/>
<rect class="h you" x="60.0" y="14" width="100" height="34" rx="10"/><text class="ht you" x="110" y="35" text-anchor="middle">YOU</text>
<rect class="h sc" x="243.4" y="14" width="113.19999999999999" height="34" rx="10"/><text class="ht sc" x="300" y="35" text-anchor="middle">THE SHORTCUT</text>
<rect class="h o" x="383.25" y="14" width="137.5" height="34" rx="10"/><text class="ht o" x="452" y="35" text-anchor="middle">CAMERA / PHOTOS</text>
<rect class="h ai" x="531.1" y="14" width="161.79999999999998" height="34" rx="10"/><text class="ht ai" x="612" y="35" text-anchor="middle">APPLE INTELLIGENCE</text>
<rect class="h o" x="714.0" y="14" width="100" height="34" rx="10"/><text class="ht o" x="764" y="35" text-anchor="middle">HEALTH</text>
<rect class="h o" x="835.4" y="14" width="113.19999999999999" height="34" rx="10"/><text class="ht o" x="892" y="35" text-anchor="middle">ICLOUD DRIVE</text>
<path class="m " d="M116 91 H290"/><path class="ar " d="M298 91 l-10 -5 v10z"/>
<text class="l" x="205.0" y="83" text-anchor="middle">tap to start</text>
<circle class="nc" cx="26" cy="91" r="11"/><text class="n" x="26" y="95" text-anchor="middle">1</text>
<path class="m sc" d="M306 144 H882"/><path class="ar sc" d="M890 144 l-10 -5 v10z"/>
<text class="l" x="596.0" y="136" text-anchor="middle">read your profile (daily kcal target)</text>
<circle class="nc" cx="26" cy="144" r="11"/><text class="n" x="26" y="148" text-anchor="middle">2</text>
<path class="m sc" d="M306 197 H754"/><path class="ar sc" d="M762 197 l-10 -5 v10z"/>
<text class="l" x="532.0" y="189" text-anchor="middle">read today's intake so far</text>
<circle class="nc" cx="26" cy="197" r="11"/><text class="n" x="26" y="201" text-anchor="middle">3</text>
<path class="m sc" d="M294 267 H120"/><path class="ar sc" d="M112 267 l10 -5 v10z"/>
<text class="l" x="205.0" y="242" text-anchor="middle">today's target, eaten, left;</text>
<text class="l" x="205.0" y="259" text-anchor="middle">camera, photo or screenshot?</text>
<circle class="nc" cx="26" cy="267" r="11"/><text class="n" x="26" y="271" text-anchor="middle">4</text>
<path class="m sc" d="M306 320 H442"/><path class="ar sc" d="M450 320 l-10 -5 v10z"/>
<text class="l" x="376.0" y="312" text-anchor="middle">take or pick the photo</text>
<circle class="nc" cx="26" cy="320" r="11"/><text class="n" x="26" y="324" text-anchor="middle">5</text>
<path class="m " d="M446 373 H310"/><path class="ar " d="M302 373 l10 -5 v10z"/>
<text class="l" x="376.0" y="365" text-anchor="middle">the photo</text>
<circle class="nc" cx="26" cy="373" r="11"/><text class="n" x="26" y="377" text-anchor="middle">6</text>
<path class="m sc" d="M306 426 H602"/><path class="ar sc" d="M610 426 l-10 -5 v10z"/>
<text class="l" x="456.0" y="418" text-anchor="middle">what is this food, and its nutrients?</text>
<circle class="nc" cx="26" cy="426" r="11"/><text class="n" x="26" y="430" text-anchor="middle">7</text>
<path class="m " d="M606 479 H310"/><path class="ar " d="M302 479 l10 -5 v10z"/>
<text class="l" x="456.0" y="471" text-anchor="middle">food name + nutrient values</text>
<circle class="nc" cx="26" cy="479" r="11"/><text class="n" x="26" y="483" text-anchor="middle">8</text>
<path class="m sc" d="M294 549 H120"/><path class="ar sc" d="M112 549 l10 -5 v10z"/>
<text class="l" x="205.0" y="524" text-anchor="middle">confirm or correct;</text>
<text class="l" x="205.0" y="541" text-anchor="middle">how much did you eat?</text>
<circle class="nc" cx="26" cy="549" r="11"/><text class="n" x="26" y="553" text-anchor="middle">9</text>
<path class="m sc" d="M306 619 H754"/><path class="ar sc" d="M762 619 l-10 -5 v10z"/>
<text class="l" x="532.0" y="594" text-anchor="middle">write and save</text>
<text class="l" x="532.0" y="611" text-anchor="middle">9 nutrients in Health</text>
<circle class="nc" cx="26" cy="619" r="11"/><text class="n" x="26" y="623" text-anchor="middle">10</text>
<path class="m sc" d="M306 689 H602"/><path class="ar sc" d="M610 689 l-10 -5 v10z"/>
<text class="l" x="456.0" y="664" text-anchor="middle">ask for a 1–2 line cheer on</text>
<text class="l" x="456.0" y="681" text-anchor="middle">target, eaten and left</text>
<circle class="nc" cx="26" cy="689" r="11"/><text class="n" x="26" y="693" text-anchor="middle">11</text>
<path class="m sc" d="M294 759 H120"/><path class="ar sc" d="M112 759 l10 -5 v10z"/>
<text class="l" x="205.0" y="734" text-anchor="middle">record card with today's</text>
<text class="l" x="205.0" y="751" text-anchor="middle">total and the cheer</text>
<circle class="nc" cx="26" cy="759" r="11"/><text class="n" x="26" y="763" text-anchor="middle">12</text>
</svg>