<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="What an Apple Shortcut connects to: how it starts and its input, Apple Intelligence, any app with Shortcuts actions, and a database through any web API">
<style>
:root{--bg:#FFFFFF;--ink:#16150F;--sub:#5A5547;--line:#8A8576;--step:#F7F6F2;--stepline:#D6D3C9;--teal:#0B6E57;--tealbg:#E6F1EC;--amber:#8A5A00;--amberbg:#FBF3E4;}
@media (prefers-color-scheme:dark){:root{--bg:#0D1117;--ink:#EFEDE6;--sub:#C9C4B6;--line:#8C877A;--step:#1D1B15;--stepline:#3B382E;--teal:#3FB592;--tealbg:#13291F;--amber:#E0A93B;--amberbg:#2A2112;}}
svg{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}
.bg{fill:var(--bg)}
.box{fill:var(--step);stroke:var(--stepline);stroke-width:1.2}
.hub{fill:var(--tealbg);stroke:var(--teal);stroke-width:2}
.ai{fill:var(--amberbg);stroke:var(--amber);stroke-width:1.5}
.t{fill:var(--ink);font-size:17px;font-weight:600}
.h{fill:var(--ink);font-size:22px;font-weight:700}
.s{fill:var(--sub);font-size:14px}
.k{fill:var(--amber);font-size:12px;font-weight:700;letter-spacing:.08em}
.kt{fill:var(--teal);font-size:12px;font-weight:700;letter-spacing:.08em}
.pill{fill:var(--bg);stroke:var(--stepline)}
.p{fill:var(--ink);font-size:14px}
.edge{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-dasharray:8 6;animation:flow 1.6s linear infinite}
.edge.ai{stroke:var(--amber);fill:none;stroke-width:2}
.edge.rev{animation-direction:reverse}
.arrow{fill:var(--line)} .arrow.a{fill:var(--amber)}
.mc,.mt{fill:var(--teal);fill-opacity:.35}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.edge{animation:none}}
</style>
<rect class="bg" width="960" height="600"/>

<!-- edges -->
<path class="edge" d="M270 300 H372"/><path class="arrow" d="M380 300 l-10 -6 v12z"/>
<path class="edge ai" d="M455 252 V196"/><path class="arrow a" d="M455 188 l-6 10 h12z"/>
<path class="edge ai" d="M505 196 V240"/><path class="arrow a" d="M505 251 l-6 -10 h12z"/>
<path class="edge" d="M592 300 H682"/><path class="arrow" d="M692 300 l-10 -6 v12z"/><path class="arrow" d="M582 300 l10 -6 v12z"/>
<path class="edge" d="M480 360 V410"/><path class="arrow" d="M480 420 l-6 -10 h12z"/><path class="arrow" d="M480 350 l-6 10 h12z"/>

<!-- hub -->
<rect class="hub" x="380" y="252" width="200" height="96" rx="18"/>
<text class="h" x="480" y="297" text-anchor="middle">Apple Shortcut</text>
<text class="s" x="480" y="322" text-anchor="middle">runs on your iPhone</text>

<!-- AI -->
<rect class="ai" x="250" y="28" width="460" height="160" rx="14"/>
<text class="t" x="480" y="58" text-anchor="middle">Apple Intelligence · Use Model</text>
<text class="k" x="276" y="92">IN</text>
<text class="p" x="316" y="92">a text prompt, with a photo or any variable inside</text>
<text class="k" x="276" y="122">OUT</text>
<text class="p" x="316" y="122">text · number · date · true/false · list · dictionary</text>
<text class="s" x="316" y="141">(JSON comes back already parsed)</text>
<text class="s" x="480" y="172" text-anchor="middle">on-device · Private Cloud Compute · ChatGPT</text>

<!-- start + input -->
<rect class="box" x="16" y="204" width="252" height="192" rx="14"/>
<text class="kt" x="36" y="232">START IT · GIVE IT INPUT</text>
<rect class="pill" x="28" y="244" width="228" height="30" rx="15"/><text class="p" x="44" y="264">Tap · Siri · Action button</text>
<rect class="pill" x="28" y="280" width="228" height="30" rx="15"/><text class="p" x="44" y="300">Automations: time, place, NFC</text>
<rect class="pill" x="28" y="316" width="228" height="30" rx="15"/><text class="p" x="44" y="336">Share sheet · Widget</text>
<rect class="pill" x="28" y="352" width="228" height="30" rx="15"/><text class="p" x="44" y="372">Camera · Photos · Text</text>

<!-- apps -->
<rect class="box" x="692" y="204" width="252" height="192" rx="14"/>
<text class="kt" x="712" y="232">ANY APP WITH ACTIONS</text>
<rect class="pill" x="712" y="244" width="212" height="74" rx="14"/>
<text class="t" x="728" y="268" style="font-size:15px">Apple apps</text>
<text class="s" x="728" y="288">Health · Calendar · Notes</text>
<text class="s" x="728" y="306">Reminders · Files · Maps …</text>
<rect class="pill" x="712" y="326" width="212" height="56" rx="14"/>
<text class="t" x="728" y="350" style="font-size:15px">Apps you install</text>
<text class="s" x="728" y="369">that offer Shortcuts actions</text>

<!-- database -->
<rect class="box" x="250" y="420" width="460" height="156" rx="14"/>
<text class="kt" x="270" y="448">YOUR DATABASE · ANY WEB API</text>
<text class="t" x="270" y="476">Lark Base</text><text class="s" x="356" y="476">(example)</text>
<!-- mini table -->
<g transform="translate(270,490)">
<rect class="pill" width="180" height="52" rx="6"/>
<rect x="0.5" y="0.5" width="179" height="16" rx="6" class="mt"/>
<path d="M0 17 H180 M0 34 H180 M60 0 V52 M120 0 V52" stroke="var(--stepline)" stroke-width="1"/>
<text class="s" x="90" y="70" text-anchor="middle">table view</text>
</g>
<!-- mini board -->
<g transform="translate(510,490)">
<rect class="pill" x="0" width="54" height="52" rx="6"/><rect class="pill" x="63" width="54" height="52" rx="6"/><rect class="pill" x="126" width="54" height="52" rx="6"/>
<rect class="mc" x="6" y="7" width="42" height="11" rx="3"/><rect class="mc" x="6" y="22" width="42" height="11" rx="3"/>
<rect class="mc" x="69" y="7" width="42" height="11" rx="3"/>
<rect class="mc" x="132" y="7" width="42" height="11" rx="3"/><rect class="mc" x="132" y="22" width="42" height="11" rx="3"/><rect class="mc" x="132" y="37" width="42" height="11" rx="3"/>
<text class="s" x="90" y="70" text-anchor="middle">board view</text>
</g>
</svg>
