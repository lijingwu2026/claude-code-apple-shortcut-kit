<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1142 500" width="1142" height="500" role="img" aria-label="How the kit builds and updates a shortcut: you describe a new shortcut or a change in plain words. 0 Claude Code writes the spec with the shortcut-spec skill: it asks who will use it, what for and why, recommends how to build it and flags what the platform can't do, saved as specs/PRD.md. You approve the spec; nothing is built until you do. Then Claude Code, on its own: 1 builds or edits the shortcut with the shortcut-dev skill, copying each action's settings from a real example (shortcut_action_index.py, examples/action-library, shortcut_io.py); 2 tests it, run by shortcut_build.py: wiring audit (audit_wiring.py), spec coverage (ac_coverage.py, with test cases from the shortcut-qa skill), regression script, and real-sample check (shortcut_action_index.py); 3 saves the signed file only when every test passes and opens the import dialog. A failed test saves nothing; it fixes and retests. You click Add and use it on your iPhone; the next change starts again. Before the first build, doctor.py checks your Mac and sets up your tests.">
<style>
:root{--bg:#FFFFFF;--ink:#16150F;--sub:#5A5547;--line:#8A8576;--step:#F7F6F2;--stepline:#D6D3C9;--teal:#0B6E57;--tealbg:#E6F1EC;--amber:#8A5A00;--amberbg:#FBF3E4;--red:#A3352B;--code:#0B4F7A;}
@media (prefers-color-scheme:dark){:root{--bg:#0D1117;--ink:#EFEDE6;--sub:#C9C4B6;--line:#8C877A;--step:#1D1B15;--stepline:#3B382E;--teal:#3FB592;--tealbg:#13291F;--amber:#E0A93B;--amberbg:#2A2112;--red:#E07A6E;--code:#7CC4F0;}}
svg{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;}
.bg{fill:var(--bg)}
.band{fill:var(--tealbg);stroke:var(--teal);stroke-width:2}
.box{fill:var(--bg);stroke:var(--teal);stroke-width:1.2}
.you{fill:var(--amberbg);stroke:var(--amber);stroke-width:1.6}
.t{fill:var(--ink);font-size:17px;font-weight:600}
.s{fill:var(--sub);font-size:13px}
.kt{fill:var(--teal);font-size:13px;font-weight:700;letter-spacing:.08em}
.ka{fill:var(--amber);font-size:12px;font-weight:700;letter-spacing:.08em}
.num{fill:var(--teal);font-size:12px;font-weight:700}
.tl{fill:var(--sub);font-size:11.5px;font-weight:700;letter-spacing:.1em}
.rule{stroke:var(--stepline);stroke-width:1}
.pill{fill:var(--step);stroke:var(--stepline)}
.p{fill:var(--ink);font-size:12.5px}
.c{fill:var(--code);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.edge{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-dasharray:8 6;}
.edge.in{stroke:var(--teal)}
.edge.fail{stroke:var(--red)}
.arrow{fill:var(--line)} .arrow.in{fill:var(--teal)} .arrow.fail{fill:var(--red)}
.lab{fill:var(--sub);font-size:13px}
.lab.fail{fill:var(--red)}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.edge{animation:none}}
</style>
